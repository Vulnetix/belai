<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Five-layer credential resolution with provenance: command line, environment, config file, agent profile, then built-in defaults">
  <style>
    .box { fill: #FFF8ED; stroke: #001614; stroke-width: 2; }
    .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #001614; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #009484; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .layer { animation: scan 3.2s ease-in-out infinite; }
    @keyframes scan { 0%,100%{ opacity:.5 } 50%{ opacity:1 } }
    .l2 { animation-delay: .45s; } .l3 { animation-delay: .9s; } .l4 { animation-delay: 1.35s; } .l5 { animation-delay: 1.8s; }
    @media (prefers-reduced-motion: reduce){ .layer{ animation:none; opacity:.85 } }
  </style>
  <rect x="0" y="0" width="640" height="340" rx="18" class="box"/>
  <text x="24" y="36" class="lbl" font-weight="bold">credential resolution — five layers, highest wins</text>

  <g font-family="'Geist Mono',ui-monospace,monospace" font-size="12">
    <g class="layer">
      <rect x="24" y="64" width="460" height="42" rx="8" fill="#001614"/>
      <text x="16" y="27" fill="#66DCC8">1 · command line --provider / -model</text>
    </g>
    <g class="layer l2">
      <rect x="24" y="116" width="420" height="42" rx="8" class="box"/>
      <text x="16" y="27" fill="#001614">2 · environment variables</text>
    </g>
    <g class="layer l3">
      <rect x="24" y="168" width="380" height="42" rx="8" class="box"/>
      <text x="16" y="27" fill="#001614">3 · config file</text>
    </g>
    <g class="layer l4">
      <rect x="24" y="220" width="340" height="42" rx="8" class="box"/>
      <text x="16" y="27" fill="#001614">4 · agent profile</text>
    </g>
    <g class="layer l5">
      <rect x="24" y="272" width="300" height="42" rx="8" class="box"/>
      <text x="16" y="27" fill="#001614">5 · built-in defaults</text>
    </g>
  </g>

  <!-- provenance -->
  <g transform="translate(520 64)">
    <rect width="96" height="250" rx="8" fill="#FFF8ED" stroke="#009484" stroke-width="2"/>
    <text x="12" y="22" class="sub">source</text>
    <text x="12" y="40" class="sub">recorded</text>
    <text x="12" y="58" class="sub">per value</text>
    <g fill="#66DCC8">
      <circle cx="24" cy="86" r="4"/><circle cx="24" cy="112" r="4"/><circle cx="24" cy="138" r="4"/><circle cx="24" cy="164" r="4"/>
    </g>
  </g>
  <text x="24" y="330" class="sub">every resolved credential carries its provenance — who set it, where, and when.</text>
</svg>