<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="The goal pass loop: act, observe, reflect, then a stall detector that stops the loop on stagnation rather than a counter">
  <style>
    .box { fill: #FFF8ED; stroke: #001614; stroke-width: 2; }
    .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #001614; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #009484; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .orbit { animation: orbit 3.4s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:.4 } 50%{ opacity:1 } }
    @media (prefers-reduced-motion: reduce){ .orbit{ animation:none } .pulse{ animation:none; opacity:.9 } }
  </style>
  <rect x="0" y="0" width="640" height="340" rx="18" class="box"/>
  <text x="24" y="36" class="lbl" font-weight="bold">goal loop: stopped by a stall, not a counter</text>

  <!-- loop -->
  <g transform="translate(150 190)">
    <circle r="86" fill="none" stroke="#001614" stroke-width="2" stroke-dasharray="6 5"/>
    <g class="orbit">
      <circle cx="0" cy="-86" r="12" fill="#66DCC8" stroke="#001614" stroke-width="3"/>
    </g>
    <circle r="6" fill="#001614"/>
  </g>

  <g font-family="'Geist Mono',ui-monospace,monospace" font-size="13" fill="#001614">
    <text x="150" y="78" text-anchor="middle">act</text>
    <text x="246" y="196">observe</text>
    <text x="150" y="312" text-anchor="middle">reflect</text>
  </g>

  <!-- stall detector -->
  <g transform="translate(360 96)">
    <rect width="256" height="148" rx="10" class="box" stroke="#009484" stroke-width="2.5"/>
    <text x="14" y="28" class="lbl" font-weight="bold">stall detector</text>
    <g class="pulse">
      <text x="14" y="56" class="sub">no new evidence for N turns</text>
      <text x="14" y="72" class="sub">no re-plan after M attempts</text>
      <text x="14" y="88" class="sub">→ stop with a blocker, not a guess</text>
    </g>
    <text x="14" y="116" class="sub">✕ counter-based: 42 turns, then fire</text>
    <text x="14" y="132" class="sub" fill="#FA5C57">  the counter runs past the answer</text>
  </g>
  <path d="M236 190 L 356 170" stroke="#009484" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="24" y="316" class="sub">a goal loop that has stalled reports the stall and the evidence. It does not fabricate progress.</text>
</svg>