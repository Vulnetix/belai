<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="A delimiter seal carrying a nonce and SHA-256 hash, and an egress strip that drops any block failing verification">
  <style>
    .box { fill: #FFF8ED; stroke: #001614; stroke-width: 2; }
    .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #001614; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #009484; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .forged { animation: shake 2.4s ease-in-out infinite; }
    @keyframes shake { 0%,100%{ transform: translateX(0) } 8%,22%{ transform: translateX(-3px) } 15%,30%{ transform: translateX(3px) } }
    .drop { animation: drop 2.4s ease-in-out infinite; }
    @keyframes drop { 0%,100%{ opacity:1 } 45%,55%{ opacity:.15 } }
    @media (prefers-reduced-motion: reduce){ .forged,.drop{ animation:none } }
  </style>
  <rect x="0" y="0" width="640" height="340" rx="18" class="box"/>
  <text x="24" y="36" class="lbl" font-weight="bold">delimiter seal → egress strip</text>

  <!-- sealed block -->
  <g transform="translate(24 60)">
    <rect width="280" height="120" rx="10" fill="#001614"/>
    <text x="14" y="26" class="mono" font-size="12" fill="#66DCC8">&lt;tools nonce=a91f2c74 sha256=3f8e9c21…&gt;</text>
    <rect x="14" y="40" width="252" height="16" rx="3" fill="#66DCC8" opacity="0.18"/>
    <rect x="14" y="62" width="252" height="16" rx="3" fill="#66DCC8" opacity="0.12"/>
    <rect x="14" y="84" width="200" height="16" rx="3" fill="#66DCC8" opacity="0.08"/>
    <text x="14" y="112" class="mono" font-size="12" fill="#66DCC8">&lt;/tools&gt;</text>
    <text x="180" y="112" class="mono" font-size="11" fill="#5FED83">sha256 ✓</text>
  </g>

  <!-- forged block -->
  <g transform="translate(336 60)" class="forged">
    <rect width="280" height="120" rx="10" fill="#001614" stroke="#FA5C57" stroke-width="2.5"/>
    <text x="14" y="26" class="mono" font-size="12" fill="#FA5C57">&lt;tools nonce=00000000 sha256=ffff…&gt;</text>
    <rect x="14" y="40" width="252" height="16" rx="3" fill="#FA5C57" opacity="0.25"/>
    <rect x="14" y="62" width="252" height="16" rx="3" fill="#FA5C57" opacity="0.18"/>
    <rect x="14" y="84" width="200" height="16" rx="3" fill="#FA5C57" opacity="0.12"/>
    <text x="14" y="112" class="mono" font-size="12" fill="#FA5C57">&lt;/tools&gt;</text>
    <text x="180" y="112" class="mono" font-size="11" fill="#FA5C57">forged</text>
  </g>

  <!-- egress strip -->
  <g transform="translate(24 224)">
    <rect width="592" height="72" rx="10" fill="#FFF8ED" stroke="#009484" stroke-width="2"/>
    <text x="16" y="30" class="lbl">egress</text>
    <text x="16" y="50" class="sub">missing / unknown nonce, or integrity hash mismatch → stripped before transport</text>
    <text x="470" y="44" class="drop mono" font-size="22" fill="#FA5C57">✕ forged</text>
  </g>
  <path d="M476 180 L 476 224" stroke="#FA5C57" stroke-width="2" stroke-dasharray="4 4"/>
</svg>