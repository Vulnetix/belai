<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Three-phase classification: phase one prompt-saturation and phase two jailbreak run locally in parallel, and only when both return safe does the opt-in phase three extraction sentinel run">
  <style>
    .box { fill: #FFF8ED; stroke: #001614; stroke-width: 2; }
    .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #001614; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #009484; }
    .wire { stroke: #001614; stroke-width: 2; fill: none; }
    .optin { stroke-dasharray: 6 5; }
    .pulse { animation: glow 3.6s ease-in-out infinite; }
    .pulse2 { animation: glow 3.6s ease-in-out infinite; animation-delay: .45s; }
    @keyframes glow { 0%,100%{ opacity:.35 } 30%,70%{ opacity:.9 } }
    @media (prefers-reduced-motion: reduce){ .pulse,.pulse2{ animation:none; opacity:.85 } }
  </style>
  <rect x="0" y="0" width="640" height="340" rx="18" class="box"/>
  <text x="24" y="36" class="lbl" font-weight="bold">three-phase classification</text>

  <!-- windows in -->
  <g transform="translate(24 70)">
    <rect width="124" height="104" rx="8" class="box"/>
    <text x="14" y="26" class="lbl">windows</text>
    <g fill="#001614" opacity="0.85">
      <rect x="14" y="42" width="96" height="6" rx="3"/>
      <rect x="14" y="56" width="80" height="6" rx="3"/>
      <rect x="14" y="70" width="90" height="6" rx="3"/>
    </g>
    <text x="14" y="94" class="sub">510 tokens</text>
  </g>

  <path class="wire" d="M148 96 H190"/>
  <path class="wire" d="M148 160 H190"/>

  <!-- phase 1 -->
  <g transform="translate(190 70)">
    <rect width="214" height="52" rx="8" class="box"/>
    <rect class="pulse" x="2" y="2" width="210" height="48" rx="6" fill="#66DCC8" opacity="0.35"/>
    <text x="14" y="22" class="lbl">phase 1 · saturation</text>
    <text x="14" y="40" class="sub">bert-tiny · embedded</text>
  </g>

  <!-- phase 2 -->
  <g transform="translate(190 134)">
    <rect width="214" height="52" rx="8" class="box"/>
    <rect class="pulse2" x="2" y="2" width="210" height="48" rx="6" fill="#66DCC8" opacity="0.35"/>
    <text x="14" y="22" class="lbl">phase 2 · jailbreak</text>
    <text x="14" y="40" class="sub">bert-base · jailbreak build</text>
  </g>

  <!-- only both-safe reaches phase 3 -->
  <path class="wire" d="M404 96 H417 V104 H430"/>
  <path class="wire" d="M404 160 H417 V104 H430"/>
  <text x="430" y="66" class="sub">both SAFE</text>

  <!-- phase 3 -->
  <g transform="translate(430 76)">
    <rect width="190" height="56" rx="8" class="box optin"/>
    <text x="14" y="24" class="lbl">phase 3 · extraction</text>
    <text x="14" y="42" class="sub">opt-in LLM sentinel</text>
  </g>
  <text x="430" y="152" class="sub">off unless classifier</text>
  <text x="430" y="166" class="sub">provider + model are set</text>

  <text x="24" y="206" class="sub">phase 1 and phase 2 run in parallel over the same windows</text>
  <text x="24" y="220" class="sub">either hit returns immediately and phase 3 never runs</text>
  <text x="24" y="240" class="sub">precedence: PROMPT_INJECTION &gt; JAILBREAK &gt; DATA_EXTRACTION &gt; MODEL_EXTRACTION &gt; SAFE</text>

  <!-- verdict -->
  <g transform="translate(24 258)">
    <rect width="592" height="52" rx="8" fill="#001614"/>
    <text x="16" y="32" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#66DCC8">decide: fail closed, and no network call on an embedded install</text>
  </g>
</svg>
