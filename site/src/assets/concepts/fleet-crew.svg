<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A delivery crew on the kanban board: a scout turns a request into build items, two builders each claim one and work it on its own branch in a worktree, a reviewer checks the branch and closes it with a draft pull request, or sends it back">
  <style>
    .box { fill: #FFF8ED; stroke: #001614; stroke-width: 2; }
    .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #001614; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #009484; }
    .dim { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; fill: #001614; opacity: .65; }
    .flow { stroke: #009484; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    .back { stroke: #FA5C57; stroke-width: 2; fill: none; stroke-dasharray: 3 5; }
    .card { animation: hop 7s ease-in-out infinite; }
    @keyframes hop {
      0%   { transform: translate(0px, 0px); opacity: 0 }
      6%   { opacity: 1 }
      22%  { transform: translate(176px, 0px) }
      44%  { transform: translate(352px, 0px) }
      66%  { transform: translate(528px, 0px) }
      90%  { transform: translate(528px, 0px); opacity: 1 }
      100% { transform: translate(528px, 0px); opacity: 0 }
    }
    .c2 { animation-delay: 1.4s; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: .9 } .c2 { opacity: 0 } }
  </style>
  <rect x="0" y="0" width="760" height="400" rx="18" class="box"/>
  <text x="24" y="36" class="lbl" font-weight="bold">a delivery crew on the kanban board</text>
  <text x="24" y="56" class="dim">the harness claims · the item text is classified · each agent works in its own worktree</text>

  <!-- lists -->
  <g transform="translate(24 84)">
    <rect width="132" height="40" rx="8" class="box"/>
    <rect x="10" y="14" width="12" height="12" rx="3" fill="#001614" opacity=".45"/>
    <text x="30" y="25" class="lbl">backlog</text>
  </g>
  <g transform="translate(200 84)">
    <rect width="132" height="40" rx="8" class="box"/>
    <rect x="10" y="14" width="12" height="12" rx="3" fill="#009484"/>
    <text x="30" y="25" class="lbl">in_progress</text>
  </g>
  <g transform="translate(376 84)">
    <rect width="132" height="40" rx="8" class="box"/>
    <rect x="10" y="14" width="12" height="12" rx="3" fill="#FCA326"/>
    <text x="30" y="25" class="lbl">review</text>
  </g>
  <g transform="translate(552 84)">
    <rect width="184" height="40" rx="8" fill="#001614"/>
    <rect x="10" y="14" width="12" height="12" rx="3" fill="#66DCC8"/>
    <text x="30" y="25" font-family="'Geist Mono',ui-monospace,monospace" font-size="13" fill="#66DCC8">done + draft PR</text>
  </g>

  <!-- cards moving along the board -->
  <g class="card"><rect x="36" y="134" width="104" height="22" rx="5" fill="#FDE0B5" stroke="#001614" stroke-width="1.5"/><text x="44" y="149" class="mono" font-family="'Geist Mono',ui-monospace,monospace" font-size="10.5" fill="#001614">K-507600 #build</text></g>
  <g class="card c2"><rect x="36" y="134" width="104" height="22" rx="5" fill="#FDE0B5" stroke="#001614" stroke-width="1.5"/><text x="44" y="149" font-family="'Geist Mono',ui-monospace,monospace" font-size="10.5" fill="#001614">K-3f9a2c #build</text></g>

  <!-- agents -->
  <g transform="translate(24 190)">
    <rect width="150" height="120" rx="10" class="box"/>
    <text x="14" y="26" class="lbl" font-weight="bold">scout</text>
    <text x="14" y="46" class="sub">claims #scout</text>
    <text x="14" y="62" class="sub">Read · Grep · Glob</text>
    <text x="14" y="78" class="sub">KanbanHandoff →</text>
    <text x="14" y="94" class="sub">#build per task</text>
  </g>
  <g transform="translate(196 190)">
    <rect width="178" height="120" rx="10" class="box"/>
    <text x="14" y="26" class="lbl" font-weight="bold">builder ×2</text>
    <text x="14" y="46" class="sub">claims a #build item</text>
    <text x="14" y="62" class="sub">own branch + worktree</text>
    <text x="14" y="78" class="sub">edits · tests · commit</text>
    <text x="14" y="94" class="sub">PublishBranch → PR</text>
  </g>
  <g transform="translate(396 190)">
    <rect width="162" height="120" rx="10" class="box"/>
    <text x="14" y="26" class="lbl" font-weight="bold">reviewer</text>
    <text x="14" y="46" class="sub">claims #needs-review</text>
    <text x="14" y="62" class="sub">checks out the branch</text>
    <text x="14" y="78" class="sub">git diff · just check</text>
    <text x="14" y="94" class="sub">approve, or send back</text>
  </g>
  <g transform="translate(580 190)">
    <rect width="156" height="120" rx="10" fill="#001614"/>
    <text x="14" y="26" class="mono" font-family="'Geist Mono',ui-monospace,monospace" font-size="13" fill="#66DCC8" font-weight="bold">you</text>
    <text x="14" y="46" font-family="'Geist Mono',ui-monospace,monospace" font-size="10.5" fill="#66DCC8">review the draft PR</text>
    <text x="14" y="62" font-family="'Geist Mono',ui-monospace,monospace" font-size="10.5" fill="#66DCC8">merge, or add a note</text>
    <text x="14" y="78" font-family="'Geist Mono',ui-monospace,monospace" font-size="10.5" fill="#66DCC8">and move it back</text>
  </g>

  <!-- agent → list links -->
  <path d="M99 190 L 99 128" class="flow"/>
  <path d="M285 190 L 266 128" class="flow"/>
  <path d="M477 190 L 442 128" class="flow"/>
  <path d="M658 190 L 644 128" class="flow"/>

  <!-- send back -->
  <path d="M477 310 C 477 356, 90 356, 90 312" class="back"/>
  <text x="24" y="376" class="dim">rejected: back to backlog as #build with notes · 3 failures → blocked</text>
</svg>
