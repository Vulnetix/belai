name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

# Never run two releases for the same version at once.
concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Force JS actions to Node 24 so deprecated Node 20 runs stop firing.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Models and binaries pass between jobs through the S3 stage, not Actions artifacts, which are
  # billed in GB-hours per month (github-runner-aws README, "Staging large hand-offs in S3"). The
  # role is assumed through OIDC and can read and write only this repository's prefix; objects
  # expire after a day. Release assets, which users install from, are unchanged.
  STAGE_BUCKET: vulnetix-gha-stage-061882422009
  STAGE_PREFIX: ${{ github.event.repository.name }}/${{ github.run_id }}
  STAGE_ROLE: arn:aws:iam::061882422009:role/gha-stage-${{ github.event.repository.name }}

jobs:
  version:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

  # Prepare the embedded classifier models once, then hand the converted
  # directories to the build job as an artifact so conversion happens once
  # rather than per variant.
  models:
    needs: version
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # setup-python cannot install on the self-hosted Amazon Linux pool; uv
      # can, and activate-environment puts a venv's python and uv pip on PATH.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install torch + safetensors
        run: |
          uv pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --quiet safetensors

      # Cache the prepared model directories, not the raw HF downloads. The key
      # pins the modelprep source and the HF commit revisions so a
      # silently-updated model cannot change a release.
      - name: Cache prepared models
        uses: actions/cache@v4
        with:
          path: internal/mlclassify/assets
          key: models-${{ hashFiles('tools/modelprep/**') }}-6e8dbe4a-a27152c9
          restore-keys: models-${{ hashFiles('tools/modelprep/**') }}-

      - name: Prepare models
        run: go run ./tools/modelprep -python python -phase1 -phase2

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.STAGE_ROLE }}
          aws-region: ap-southeast-2
      # Only the build job below reads these, in this same run.
      - name: Stage models
        run: |
          set -euo pipefail
          tar -czf - -C internal/mlclassify/assets . | aws s3 cp - "s3://$STAGE_BUCKET/$STAGE_PREFIX/models.tgz"

  # Belai is pure Go (CGO_ENABLED=0), so every target cross-compiles from one
  # Linux box. Each variant family is built for all six targets.
  build:
    needs: [version, models]
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.STAGE_ROLE }}
          aws-region: ap-southeast-2
      - name: Fetch the staged models
        run: |
          set -euo pipefail
          mkdir -p internal/mlclassify/assets
          aws s3 cp "s3://$STAGE_BUCKET/$STAGE_PREFIX/models.tgz" - | tar -xzf - -C internal/mlclassify/assets

      # The speech model every variant embeds for voice input. The key follows
      # the checksum pinned in the source, so a changed model cannot slip into
      # a release; voiceprep verifies the file either way.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: internal/voice/assets
          key: voice-model-${{ hashFiles('internal/voice/models.go') }}

      - name: Prepare the speech model
        run: go run ./tools/voiceprep

      - name: Build cross-platform binaries
        run: |
          VERSION=${{ needs.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/vulnetix/belai/internal/version.Version=${VERSION} -X github.com/vulnetix/belai/internal/version.Commit=${COMMIT} -X github.com/vulnetix/belai/internal/version.BuildDate=${BUILD_DATE}"
          mkdir -p bin

          # variant: vanilla, no-classifier, bert-guardrails, bert-guardrails-jailbreak, pix-sandbox
          build_target() {
            local variant="$1" goos="$2" goarch="$3" suffix="$4"
            # The plain belai build embeds nothing, the speech model included: it
            # is the small build. Every other family embeds the model for voice.
            local name="belai" tags="" extra=""
            case "$variant" in
              no-classifier)
                name="belai-no-classifier"
                tags="-tags belai_voice"
                extra="-X github.com/vulnetix/belai/internal/version.Variant=no-classifier"
                ;;
              bert-guardrails)
                name="belai-bert-guardrails"
                tags="-tags belai_bert,belai_voice"
                extra="-X github.com/vulnetix/belai/internal/version.Variant=bert-guardrails"
                ;;
              bert-guardrails-jailbreak)
                name="belai-bert-guardrails-jailbreak"
                tags="-tags belai_bert_jailbreak,belai_voice"
                extra="-X github.com/vulnetix/belai/internal/version.Variant=bert-guardrails-jailbreak"
                ;;
              pix-sandbox)
                name="belai-pix-sandbox"
                tags="-tags belai_voice,belai_sandbox"
                extra="-X github.com/vulnetix/belai/internal/version.Variant=pix-sandbox"
                ;;
            esac
            echo "  bin/${name}-${goos}-${goarch}${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build $tags -ldflags "$LDFLAGS $extra" \
              -o "bin/${name}-${goos}-${goarch}${suffix}" ./cmd/belai
          }

          for variant in "" no-classifier bert-guardrails bert-guardrails-jailbreak pix-sandbox; do
            build_target "$variant" linux   amd64 ""
            build_target "$variant" linux   arm64 ""
            build_target "$variant" darwin  amd64 ""
            build_target "$variant" darwin  arm64 ""
            build_target "$variant" windows amd64 ".exe"
            build_target "$variant" windows arm64 ".exe"
          done

      # About 4 GB a release: only the release job reads it, in this same run.
      - name: Stage binaries
        run: |
          set -euo pipefail
          tar -czf - -C bin . | aws s3 cp - "s3://$STAGE_BUCKET/$STAGE_PREFIX/binaries.tgz"

  release:
    needs: [version, build]
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    # The binaries are about 3.4 GB; on a local podman runner their download alone ran past 20
    # minutes and v0.109.0's release was cancelled.
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.STAGE_ROLE }}
          aws-region: ap-southeast-2
      - name: Fetch the staged binaries
        run: |
          set -euo pipefail
          mkdir -p bin
          aws s3 cp "s3://$STAGE_BUCKET/$STAGE_PREFIX/binaries.tgz" - | tar -xzf - -C bin

      # Ship the installer with the release so a vanity host can redirect to
      # releases/latest/download/install.sh, and so the script that fetches a
      # release is versioned alongside it.
      - name: Stage installer
        run: cp install.sh bin/install.sh

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums.txt

      # The subject list for the provenance job. Small on purpose: the 3.4 GB
      # binaries artifact is never downloaded a second time. The bytes are the
      # release asset's, so the signed statement names what a user downloads.
      - uses: actions/upload-artifact@v6
        with:
          name: release-subjects
          path: bin/checksums.txt
          retention-days: 1

      - name: Create or update Release
        run: |
          VERSION=${{ needs.version.outputs.version }}
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" bin/* --clobber
          else
            gh release create "$VERSION" bin/* \
              --title "Release $VERSION" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA v1 build provenance for every binary in the release, signed and
  # verified by the reusable workflow in Vulnetix/cli (the cli release uses the
  # same one). It runs beside update-packages, not after it, because the
  # package managers carry the binaries and not the provenance.
  provenance:
    needs: release
    permissions:
      contents: write
      id-token: write
    uses: Vulnetix/cli/.github/workflows/slsa-provenance.yml@d30744892a42c71dd0aa9ce622ca929e7a2b73eb
    with:
      subjects_artifact: release-subjects
      version: ${{ needs.release.outputs.version }}

  update-packages:
    needs: release
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 20
    # One package update at a time across versions: two releases tagged
    # minutes apart raced on the tap (v0.64.0's push was rejected), and an
    # older one finishing last would have downgraded the formula. A queued
    # older run is also skipped below once a newer version is in place.
    concurrency:
      group: belai-package-managers
      cancel-in-progress: false
    steps:
      - name: Checkout belai repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/homebrew-tap
          ref: main
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: homebrew-tap

      - name: Checkout scoop-bucket
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/scoop-bucket
          ref: main
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: scoop-bucket

      - name: Download checksums
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 \
            "https://github.com/Vulnetix/belai/releases/download/${{ needs.release.outputs.version }}/checksums.txt" \
            -o checksums.txt

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          VER_NUM="${{ needs.release.outputs.version }}"
          VER_NUM="${VER_NUM#v}"

          hash_for() {
            local sum
            sum=$(awk -v f="$1" '$2 == f { print $1 }' checksums.txt)
            if [ ${#sum} -ne 64 ]; then
              echo "::error::no SHA-256 for $1 in checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$sum"
          }
          DARWIN_ARM64=$(hash_for belai-bert-guardrails-darwin-arm64)
          DARWIN_AMD64=$(hash_for belai-bert-guardrails-darwin-amd64)
          LINUX_ARM64=$(hash_for belai-bert-guardrails-linux-arm64)
          LINUX_AMD64=$(hash_for belai-bert-guardrails-linux-amd64)

          cd homebrew-tap
          BREW="Formula/belai.rb"
          if [ ! -f "$BREW" ]; then
            echo "::error::homebrew-tap has no Formula/belai.rb" >&2
            exit 1
          fi
          # Never downgrade: a release that finishes after a newer one leaves
          # the newer formula in place.
          CUR=$(sed -n 's/^ *version "\([^"]*\)".*/\1/p' "$BREW" | head -n1)
          if [ -n "$CUR" ] && [ "$CUR" != "$VER_NUM" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$VER_NUM" | sort -V | tail -n1)" = "$CUR" ]; then
            echo "::notice::homebrew-tap already has belai ${CUR}, newer than ${VER_NUM}; not updating"
            exit 0
          fi

          # The default asset family is the embedded guardrails build. The
          # leading slash keeps these substitutions from colliding with the
          # already-prefixed variant asset names.
          sed -i "s#/belai-darwin-arm64#/belai-bert-guardrails-darwin-arm64#" "$BREW"
          sed -i "s#/belai-darwin-amd64#/belai-bert-guardrails-darwin-amd64#" "$BREW"
          sed -i "s#/belai-linux-arm64#/belai-bert-guardrails-linux-arm64#" "$BREW"
          sed -i "s#/belai-linux-amd64#/belai-bert-guardrails-linux-amd64#" "$BREW"

          sed -i "s/version \"[^\"]*\"/version \"${VER_NUM}\"/" "$BREW"
          sed -i "/belai-bert-guardrails-darwin-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${DARWIN_ARM64}\"/}" "$BREW"
          sed -i "/belai-bert-guardrails-darwin-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${DARWIN_AMD64}\"/}" "$BREW"
          sed -i "/belai-bert-guardrails-linux-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${LINUX_ARM64}\"/}" "$BREW"
          sed -i "/belai-bert-guardrails-linux-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${LINUX_AMD64}\"/}" "$BREW"

          for want in "${VER_NUM}" "${DARWIN_ARM64}" "${DARWIN_AMD64}" "${LINUX_ARM64}" "${LINUX_AMD64}"; do
            if ! grep -q "$want" "$BREW"; then
              echo "::error::$BREW does not contain $want after the edit; the formula layout has moved" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BREW"
          if ! git diff --cached --quiet; then
            git commit -m "belai ${VER_NUM}"
            # Someone else may have pushed to the tap meanwhile: rebase and
            # try again rather than fail the release.
            for attempt in 1 2 3 4; do
              git push && break
              [ "$attempt" = 4 ] && { echo "::error::could not push to homebrew-tap" >&2; exit 1; }
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi

      - name: Update Scoop manifest
        run: |
          set -euo pipefail
          VER_NUM="${{ needs.release.outputs.version }}"
          VER_NUM="${VER_NUM#v}"

          hash_for() {
            local sum
            sum=$(awk -v f="$1" '$2 == f { print $1 }' checksums.txt)
            if [ ${#sum} -ne 64 ]; then
              echo "::error::no SHA-256 for $1 in checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$sum"
          }
          WIN_AMD64=$(hash_for belai-bert-guardrails-windows-amd64.exe)
          WIN_ARM64=$(hash_for belai-bert-guardrails-windows-arm64.exe)

          cd scoop-bucket
          if [ ! -f bucket/belai.json ]; then
            echo "::error::scoop-bucket has no bucket/belai.json" >&2
            exit 1
          fi
          CUR=$(jq -r '.version // ""' bucket/belai.json)
          if [ -n "$CUR" ] && [ "$CUR" != "$VER_NUM" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$VER_NUM" | sort -V | tail -n1)" = "$CUR" ]; then
            echo "::notice::scoop-bucket already has belai ${CUR}, newer than ${VER_NUM}; not updating"
            exit 0
          fi
          jq --indent 4 \
            --arg v "$VER_NUM" \
            --arg h64 "$WIN_AMD64" \
            --arg harm "$WIN_ARM64" \
            '.version = $v |
             .architecture."64bit".url = "https://github.com/Vulnetix/belai/releases/download/v\($v)/belai-bert-guardrails-windows-amd64.exe#/belai.exe" |
             .architecture."64bit".hash = $h64 |
             .architecture.arm64.url = "https://github.com/Vulnetix/belai/releases/download/v\($v)/belai-bert-guardrails-windows-arm64.exe#/belai.exe" |
             .architecture.arm64.hash = $harm |
             .autoupdate.architecture."64bit".url = "https://github.com/Vulnetix/belai/releases/download/v$version/belai-bert-guardrails-windows-amd64.exe#/belai.exe" |
             .autoupdate.architecture."64bit".hash.regex = "([a-fA-F0-9]{64})  belai-bert-guardrails-windows-amd64.exe" |
             .autoupdate.architecture.arm64.url = "https://github.com/Vulnetix/belai/releases/download/v$version/belai-bert-guardrails-windows-arm64.exe#/belai.exe" |
             .autoupdate.architecture.arm64.hash.regex = "([a-fA-F0-9]{64})  belai-bert-guardrails-windows-arm64.exe"' bucket/belai.json > /tmp/belai.json
          mv /tmp/belai.json bucket/belai.json

          test "$(jq -r .version bucket/belai.json)" = "$VER_NUM"
          test "$(jq -r '.architecture."64bit".hash' bucket/belai.json)" = "$WIN_AMD64"
          test "$(jq -r '.architecture.arm64.hash' bucket/belai.json)" = "$WIN_ARM64"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/belai.json
          if ! git diff --cached --quiet; then
            git commit -m "belai ${VER_NUM}"
            for attempt in 1 2 3 4; do
              git push && break
              [ "$attempt" = 4 ] && { echo "::error::could not push to scoop-bucket" >&2; exit 1; }
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi

  # Publish the release to the Transparency Exchange API.
  #
  # Runs after update-packages for the reason the cli's job does: the Homebrew
  # and Scoop channels it names must carry the version before a machine is
  # told to install it from there.
  publish-tea:
    needs: [release, update-packages, provenance]
    # A provenance failure publishes the release without the bundle, with a
    # warning below, rather than leaving the transparency log silent about it.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.update-packages.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 20
    # id-token lets this job get an OIDC token from GitHub, the identity public
    # Fulcio issues a short-lived certificate against: keyless signing.
    permissions:
      contents: write
      id-token: write
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
      # Pinned, not latest: a CLI regression must not stop belai releases
      # publishing with no way to roll back short of a CLI release.
      CLI_VERSION: v3.126.7
    steps:
      # Without these the CLI falls back to the shared community organisation,
      # which persists nothing, so a missing secret must stop the job instead
      # of looking like a publish.
      - name: Require the Vulnetix credentials
        run: |
          if [ -z "$VULNETIX_ORG_ID" ] || [ -z "$VULNETIX_API_KEY" ]; then
            echo "::error::VULNETIX_ORG_ID and VULNETIX_API_KEY are not set for this repository; nothing can be published to TEA"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install the Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh \
            | sh -s -- --install-dir "$HOME/.local/bin" --version "$CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Not fatal: `tea release` drops a file it cannot read and says so.
      - name: Download the provenance bundle
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: slsa-provenance
          path: provenance

      - name: Download checksums
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 \
            "https://github.com/Vulnetix/belai/releases/download/${{ needs.release.outputs.version }}/checksums.txt" \
            -o checksums.txt

      # The organisation's quality gate makes `sca` exit non-zero on a policy
      # breach, and it writes the SBOM before returning that verdict. The
      # verdict is a scan result, not a publication failure: the release
      # already exists on GitHub, so refusing to record it would leave the
      # transparency log silent about it.
      - name: Generate the release SBOM
        continue-on-error: true
        run: vulnetix sca --no-banner --no-progress -o belai.cdx.json

      - name: Report what was produced
        run: |
          if [ -s belai.cdx.json ]; then
            echo "SBOM: $(wc -c < belai.cdx.json) bytes"
          else
            echo "::warning::no SBOM was produced; publishing the release without one"
          fi
          if [ -s provenance/provenance.sigstore.json ]; then
            echo "provenance: $(wc -c < provenance/provenance.sigstore.json) bytes"
          else
            echo "::warning::no provenance bundle was produced; publishing the release without it"
          fi

      # v3 of the installer, as in the cli release: the cosign it installs
      # honours --output-signature and --output-certificate. The v4 installer
      # brings cosign v3, which ignores both and wants --bundle, so the
      # release's .sig and .pem would never be written.
      - name: Install cosign
        if: hashFiles('belai.cdx.json') != ''
        uses: sigstore/cosign-installer@v3

      # cosign rather than actions/attest-build-provenance, which persists
      # through GitHub's plan-gated attestation store. Fulcio and Rekor are
      # public goods and the output verifies with stock tooling either way.
      - name: Sign the SBOM (keyless)
        if: hashFiles('belai.cdx.json') != ''
        run: |
          set -euo pipefail

          cosign sign-blob --yes \
            --output-signature belai.cdx.json.sig \
            --output-certificate belai.cdx.json.pem \
            belai.cdx.json

          # The same claim as an in-toto/DSSE envelope, with the SBOM as the
          # predicate, for consumers that speak attestations.
          cosign attest-blob --yes \
            --type cyclonedx \
            --predicate belai.cdx.json \
            --output-attestation belai.cdx.json.intoto.jsonl \
            belai.cdx.json

          cosign verify-blob \
            --signature belai.cdx.json.sig \
            --certificate belai.cdx.json.pem \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            belai.cdx.json

          gh release upload "${{ needs.release.outputs.version }}" \
            belai.cdx.json.sig belai.cdx.json.pem \
            belai.cdx.json.intoto.jsonl --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish product, release, artifacts and distributions
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"

          # --checksums turns every published asset into a distribution, with
          # the digests from the file a user verifies a download against.
          vulnetix tea release belai.cdx.json provenance/provenance.sigstore.json \
            --version "$VERSION" \
            --checksums checksums.txt \
            --exclude checksums.txt \
            --channel "name=Homebrew: brew install vulnetix/tap/belai,url=https://github.com/Vulnetix/homebrew-tap" \
            --channel "name=Scoop: scoop bucket add vulnetix https://github.com/Vulnetix/scoop-bucket && scoop install belai,url=https://github.com/Vulnetix/scoop-bucket" \
            --channel "name=go install github.com/vulnetix/belai/cmd/belai@${VERSION},purl=pkg:golang/github.com/vulnetix/belai@${VERSION}" \
            --channel "name=Install script: curl -fsSL https://raw.githubusercontent.com/Vulnetix/belai/main/install.sh | sh,url=https://raw.githubusercontent.com/Vulnetix/belai/main/install.sh" \
            --visibility public
