name: CI

on:
  push:
    # Not Dependabot's branches: each update PR already runs its own checks, and a
    # run per branch push fanned seven Dependabot PRs into 70 jobs at once.
    # Tags are listed because any branch filter alone stops tag pushes.
    branches-ignore: ['dependabot/**']
    tags: ['**']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go test -race
        run: go test -race ./...

      - name: cross-compile (windows)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: cross-compile (darwin)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...

  # The embedded-model path is exercised here so a drift in the modelprep tool,
  # the attack-label orientation, or the tagged build fails CI before a release.
  models:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        # setup-python cannot install on the self-hosted Amazon Linux pool; uv
        # can, and activate-environment puts a venv's python and uv pip on PATH.
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install torch + safetensors
        run: |
          uv pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --quiet safetensors

      - name: Cache prepared models
        uses: actions/cache@v4
        with:
          path: internal/mlclassify/assets
          key: models-${{ hashFiles('tools/modelprep/**') }}-6e8dbe4a-a27152c9
          restore-keys: models-${{ hashFiles('tools/modelprep/**') }}-

      - name: Prepare models
        run: go run ./tools/modelprep -python python -phase1 -phase2

      # No -race here. The golden tests run real model inference, and the race
      # detector's shadow memory multiplies the model's footprint: phase 2
      # peaks at ~10.4 GB under -race (2.9 GB without) and was killed on the
      # 8 GB runners. The package's own code is still race-tested by the
      # `test` job's `go test -race ./...`.
      - name: Golden tests (phase 1)
        run: go test -tags belai_bert ./internal/mlclassify/...

      - name: Golden tests (phase 2)
        run: go test -tags belai_bert_jailbreak ./internal/mlclassify/...